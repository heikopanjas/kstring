name: Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - 'feature/**'

jobs:
  build:
    name: ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform_name: Linux
            platform_id: linux
            cmake_generator: 'Unix Makefiles'
          - os: macos-latest
            platform_name: macOS
            platform_id: darwin
            cmake_generator: 'Unix Makefiles'
          - os: windows-latest
            platform_name: Windows
            platform_id: windows
            cmake_generator: 'Visual Studio 17 2022'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -G "${{ matrix.cmake_generator }}" -B _build -DCMAKE_BUILD_TYPE=Release -DKSTRING_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build _build --config Release

      - name: Install to staging directory
        run: cmake --install _build --prefix _staging --config Release

      - name: Create archive
        run: |
          cd _staging
          tar -czf ../kstring-${{ matrix.platform_id }}.tar.gz .
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kstring-${{ matrix.platform_id }}
          path: kstring-${{ matrix.platform_id }}.tar.gz
          retention-days: 7

  release:
    name: Create Pre-Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract build info
        id: info
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep '^kstring-build-' | head -1 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            SINCE="since \`$PREV_TAG\`"
          else
            RANGE="HEAD"
            SINCE="(initial build)"
          fi

          generate_section() {
            local title="$1"
            local pattern="$2"
            local commits
            commits=$(git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- ${pattern}" || true)
            if [ -n "$commits" ]; then
              echo "### ${title}"
              echo "${commits}"
              echo ""
            fi
          }

          {
            echo "**Build:** ${{ github.run_number }}"
            echo "**Date:** ${{ steps.info.outputs.date }}"
            echo "**Commit:** [\`${{ steps.info.outputs.short_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Branch:** \`develop\`"
            echo ""
            echo "---"
            echo ""
            echo "## Changelog ${SINCE}"
            echo ""
            generate_section "Features" "feat"
            generate_section "Bug Fixes" "fix"
            generate_section "Performance" "perf"
            generate_section "Build & CI" "(build|ci)"
            generate_section "Documentation" "docs"
            generate_section "Refactoring" "refactor"
            generate_section "Tests" "test"

            OTHER=$(git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges | grep -vE "^- (feat|fix|perf|build|ci|docs|refactor|test)" || true)
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "${OTHER}"
              echo ""
            fi
          } > changelog.md

          cat changelog.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kstring-build-${{ github.run_number }}-${{ steps.info.outputs.timestamp }}
          name: kstring-build-${{ github.run_number }}-${{ steps.info.outputs.timestamp }}
          prerelease: true
          draft: false
          make_latest: false
          body_path: changelog.md
          files: |
            artifacts/kstring-linux/kstring-linux.tar.gz
            artifacts/kstring-darwin/kstring-darwin.tar.gz
            artifacts/kstring-windows/kstring-windows.tar.gz
